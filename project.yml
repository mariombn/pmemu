name: PMEmu

options:
  bundleIdPrefix: com.mariombn
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  PMEmu:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - target: PMEmuWatchApp
        embed: true
      - framework: Vendor/mGBA/mGBA.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariombn.pmemu
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Shared/Emulation/PMEmu-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/mGBA/Headers $(PROJECT_DIR)/Sources/Shared/Emulation
        INFOPLIST_KEY_CFBundleDisplayName: PMEmu
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: 1

  PMEmuWatchApp:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - path: Sources/WatchApp
      - path: Sources/Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - framework: Vendor/mGBA/mGBA.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariombn.pmemu.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Shared/Emulation/PMEmu-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/mGBA/Headers $(PROJECT_DIR)/Sources/Shared/Emulation
        INFOPLIST_KEY_CFBundleDisplayName: PMEmu
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.mariombn.pmemu
        TARGETED_DEVICE_FAMILY: 4
